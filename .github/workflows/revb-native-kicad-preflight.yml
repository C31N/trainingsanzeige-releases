name: Rev B STX883PRO native KiCad design preflight (no fab release)
on:
  push:
    branches: [codex/buzzer-revb-stx883pro-layout-2026-11-18]
    paths:
      - hardware/funktaster/revb-stx883pro/Buzzer_RevB_STX883PRO_Entwurf_B0.5.zip
      - .github/workflows/revb-native-kicad-preflight.yml
      - hardware/funktaster/revb-stx883pro/tools/apply_b04_fixes.py
      - hardware/funktaster/revb-stx883pro/tools/apply_b05_schematic_fix.py
  pull_request:
    paths:
      - hardware/funktaster/revb-stx883pro/Buzzer_RevB_STX883PRO_Entwurf_B0.5.zip
      - .github/workflows/revb-native-kicad-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-kicad8:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unpack exact B0.4 candidate and check manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out src
          unzip -q hardware/funktaster/revb-stx883pro/Buzzer_RevB_STX883PRO_Entwurf_B0.3.zip -d src
          mv src/Buzzer_RevB_STX883PRO_B0.3 src/Buzzer_RevB_STX883PRO_B0.4
          cd src/Buzzer_RevB_STX883PRO_B0.4/firmware
          sha256sum -c SHA256SUMS.txt
          cd ../../../
          python3 hardware/funktaster/revb-stx883pro/tools/apply_b04_fixes.py src/Buzzer_RevB_STX883PRO_B0.4
          python3 hardware/funktaster/revb-stx883pro/tools/apply_b05_schematic_fix.py src/Buzzer_RevB_STX883PRO_B0.4
          mv src/Buzzer_RevB_STX883PRO_B0.4 src/Buzzer_RevB_STX883PRO_B0.5
          # Keep a complete editable design artifact even when DRC/ERC fails.
          (cd src && zip -qr ../out/Buzzer_RevB_STX883PRO_Entwurf_B0.5.zip Buzzer_RevB_STX883PRO_B0.5)
      - name: Install real KiCad 8, not Ubuntu's default KiCad 7
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-8.0-releases
          sudo apt-get update -qq
          # CLI DRC/ERC plus pcbnew need no huge KiCad 3D model recommendations.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends kicad
          kicad-cli version | tee out/kicad-version.txt
          grep -q '^8[.]' out/kicad-version.txt
      - name: Fill GND zones and execute independent DRC/ERC
        shell: bash
        run: |
          set +e
          set -uo pipefail
          PCB=src/Buzzer_RevB_STX883PRO_B0.5/kicad/buzzer-revb-stx883pro-ROUTED-V3-EXPERIMENT.kicad_pcb
          SCH=src/Buzzer_RevB_STX883PRO_B0.5/kicad/buzzer-revb-stx883pro.kicad_sch
          # pcbnew is necessary for zone connectivity; DRC on unfilled zones would be misleading
          /usr/bin/python3 - "$PCB" src/Buzzer_RevB_STX883PRO_B0.5/kicad/buzzer-revb-stx883pro.kicad_pcb <<'PY'
          import sys
          import pcbnew
          src, dst = sys.argv[1:]
          board=pcbnew.LoadBoard(src)
          filler=pcbnew.ZONE_FILLER(board)
          filler.Fill(board.Zones())
          pcbnew.SaveBoard(dst,board)
          print("Native KiCad zone fill performed")
          PY
          fill_rc=$?
          if [ "$fill_rc" -eq 0 ]; then
            kicad-cli pcb drc --format json --severity-error --severity-warning --schematic-parity --exit-code-violations --output out/native-drc.json src/Buzzer_RevB_STX883PRO_B0.5/kicad/buzzer-revb-stx883pro.kicad_pcb
            drc_rc=$?
          else
            printf 'pcbnew zone fill failed with rc=%s\n' "$fill_rc" | tee out/zone-fill-error.txt
            drc_rc=1
          fi
          kicad-cli sch erc --format json --severity-error --severity-warning --exit-code-violations --output out/native-erc.json "$SCH"
          erc_rc=$?
          printf 'ZONE_FILL=%s\nDRC=%s\nERC=%s\n' "$fill_rc" "$drc_rc" "$erc_rc" | tee out/native-cli-exit-codes.txt
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path("out").glob("native-*.json")):
              try:
                  j=json.loads(p.read_text())
                  print(p.name, "top-level keys", list(j))
                  for key in ("violations","unconnected_items","schematic_parity"):
                      if key in j:
                          a=j[key]
                          print(" ", key, len(a) if isinstance(a,list) else a)
              except Exception as e:print("Could not parse",p,e)
          PY
          test "$fill_rc" -eq 0 && test "$drc_rc" -eq 0 && test "$erc_rc" -eq 0
      - name: Upload actual validation evidence (NOT fabrication files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revb-b05-native-kicad8-preflight
          path: |
            out/kicad-version.txt
            out/native-drc.json
            out/native-erc.json
            out/native-cli-exit-codes.txt
            out/zone-fill-error.txt
            out/Buzzer_RevB_STX883PRO_Entwurf_B0.5.zip
          retention-days: 14
          if-no-files-found: warn
